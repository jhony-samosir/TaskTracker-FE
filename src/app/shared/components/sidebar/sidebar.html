<div class="flex h-full flex-col bg-white">
  <!-- Brand Logo -->
  <div
    class="flex h-16 items-center gap-3 px-5 border-b border-slate-100"
    [class.justify-center]="collapsed"
  >
    <div
      class="flex h-9 w-9 items-center justify-center rounded-lg bg-linear-to-br from-indigo-500 to-indigo-700 shadow-sm shadow-indigo-200 shrink-0"
    >
      <mat-icon class="text-white text-lg leading-none w-5 h-5">checklist</mat-icon>
    </div>
    @if (!collapsed) {
      <div class="flex flex-col min-w-0">
        <span class="text-sm font-bold text-slate-900 leading-tight">Task Tracker</span>
        <span class="text-[10px] font-medium text-slate-500 leading-tight"
          >Task Management System</span
        >
      </div>
    }
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
    @for (item of menuItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' || item.route === '/' }"
        (click)="onMenuItemClick()"
        [matTooltip]="collapsed ? item.label : ''"
        matTooltipPosition="right"
        class="group flex items-center gap-3 rounded-xl px-3 h-10 text-sm font-medium text-slate-500 transition-all duration-150 hover:bg-slate-100 hover:text-slate-800"
        [class.justify-center]="collapsed"
        [class.bg-indigo-50]="rla.isActive"
        [class.text-indigo-700]="rla.isActive"
        [class.font-semibold]="rla.isActive"
        #rla="routerLinkActive"
      >
        <mat-icon
          class="text-xl shrink-0 transition-colors duration-150"
          [class.text-indigo-600]="rla.isActive"
          >{{ item.icon }}</mat-icon
        >
        @if (!collapsed) {
          <span class="truncate">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Bottom section: Quick action + Profile -->
  <div class="border-t border-slate-100 p-3 space-y-2">
    <!-- Quick Action Button -->
    @if (user?.role === 'ADMIN') {
      <button
        (click)="onCreateTask()"
        [matTooltip]="collapsed ? 'Create Task' : ''"
        matTooltipPosition="right"
        class="flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all duration-150 hover:bg-indigo-700 hover:shadow-md active:scale-[0.98]"
        [class.px-3]="collapsed"
      >
        <mat-icon class="text-lg w-5 h-5 leading-none">add</mat-icon>
        @if (!collapsed) {
          <span>Create Task</span>
        }
      </button>
    }

    <!-- Profile -->
    @if (user) {
      <div
        [matTooltip]="collapsed ? user.name + ' (' + user.role + ')' : ''"
        matTooltipPosition="right"
        class="flex items-center gap-3 rounded-xl px-2 py-2 transition-colors hover:bg-slate-50 cursor-pointer"
        [class.justify-center]="collapsed"
      >
        <div
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-indigo-100 text-xs font-bold text-indigo-700"
        >
          {{ userInitials }}
        </div>
        @if (!collapsed) {
          <div class="flex flex-col min-w-0">
            <span class="text-sm font-medium text-slate-800 truncate">{{ user.name }}</span>
            <span class="text-xs text-slate-500">{{ user.role }}</span>
          </div>
        }
      </div>
    }

    <!-- Logout -->
    <button
      (click)="onLogoutClick()"
      [matTooltip]="collapsed ? 'Logout' : ''"
      matTooltipPosition="right"
      class="flex w-full items-center gap-3 rounded-xl px-3 h-9 text-sm font-medium text-slate-500 transition-all duration-150 hover:bg-rose-50 hover:text-rose-600"
      [class.justify-center]="collapsed"
    >
      <mat-icon class="text-xl shrink-0">logout</mat-icon>
      @if (!collapsed) {
        <span>Logout</span>
      }
    </button>
  </div>
</div>
