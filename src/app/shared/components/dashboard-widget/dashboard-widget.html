<div class="bg-white rounded-2xl border border-slate-200 h-full flex flex-col">
  <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
    <div class="flex flex-col">
      <h3 class="text-base font-semibold text-slate-900 leading-tight">
        {{ title() }}
      </h3>
      @if (subtitle()) {
        <span class="text-sm text-slate-500 mt-0.5">
          {{ subtitle() }}
        </span>
      }
    </div>
    <div class="flex items-center space-x-2">
      <ng-content select="[widget-actions]" />
    </div>
  </div>

  <div class="p-6 flex-1">
    <ng-content />
  </div>
</div>
