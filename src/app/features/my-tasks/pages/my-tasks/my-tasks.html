<div class="space-y-6 h-full flex flex-col">
  <!-- Page Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">My Tasks</h1>
      <p class="mt-1 text-sm text-slate-500">
        Manage and track the progress of tasks assigned to you. Drag and drop to update statuses.
      </p>
    </div>
    <div class="flex items-center gap-3">
      @if (saving()) {
        <div class="flex items-center gap-2 text-sm text-indigo-600 font-medium">
          <mat-progress-spinner mode="indeterminate" diameter="16"></mat-progress-spinner>
          <span>Saving...</span>
        </div>
      }
      <button
        mat-stroked-button
        (click)="reload()"
        [disabled]="loading()"
        class="!h-10 !rounded-xl !border-slate-200 !bg-white hover:!bg-slate-50"
      >
        <mat-icon class="!text-lg">refresh</mat-icon>
        Sync Tasks
      </button>
    </div>
  </div>

  <!-- Filters Section -->
  <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
    <app-task-filter
      [filters]="filterValues()"
      [statusCounts]="statusCounts()"
      (filterChange)="onFilterChange($event)"
    ></app-task-filter>
  </div>

  <!-- Main Board Area -->
  <div class="flex-1 relative">
    @if (loading()) {
      <div
        class="absolute inset-0 bg-white/70 backdrop-blur-sm flex flex-col items-center justify-center rounded-2xl z-10"
      >
        <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        <span class="mt-3 text-sm font-semibold text-slate-600">Loading your tasks...</span>
      </div>
    }

    @if (error(); as errorMsg) {
      <div class="bg-rose-50 border border-rose-200 rounded-2xl p-5 flex items-start gap-3 mb-4">
        <mat-icon class="text-rose-600 shrink-0">error_outline</mat-icon>
        <div class="flex-1">
          <h4 class="text-sm font-semibold text-rose-800">Unable to load tasks</h4>
          <p class="text-xs text-rose-600 mt-1">{{ errorMsg }}</p>
          <button
            mat-flat-button
            class="!bg-rose-600 !text-white !rounded-xl !mt-3 !h-9 !text-xs"
            (click)="reload()"
          >
            Retry
          </button>
        </div>
      </div>
    }

    <app-task-board
      [tasks]="tasks()"
      (taskSelected)="openTask($event)"
      (statusChange)="updateStatus($event)"
    ></app-task-board>
  </div>
</div>
