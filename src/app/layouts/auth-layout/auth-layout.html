<div class="min-h-screen w-full flex bg-slate-50">
  <!-- Left Side: Branding / Illustration (Hidden on Mobile) -->
  <div
    class="hidden lg:flex lg:w-1/2 bg-indigo-600 relative overflow-hidden flex-col justify-between p-12"
  >
    <!-- Abstract Background Elements -->
    <div class="absolute inset-0 z-0 opacity-20">
      <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-white blur-3xl"></div>
      <div
        class="absolute bottom-0 right-0 w-[40rem] h-[40rem] rounded-full bg-indigo-800 blur-3xl"
      ></div>
    </div>

    <!-- Branding -->
    <div class="relative z-10 flex items-center gap-3">
      <div
        class="flex h-12 w-12 items-center justify-center rounded-xl bg-white text-indigo-600 shadow-md"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
          />
        </svg>
      </div>
      <span class="text-2xl font-bold text-white tracking-tight">Task Tracker</span>
    </div>

    <!-- Main Copy -->
    <div class="relative z-10 max-w-md">
      <h1 class="text-4xl font-bold text-white leading-tight mb-4">
        Manage your tasks with ease and efficiency
      </h1>
      <p class="text-indigo-100 text-lg leading-relaxed">
        Streamline your workflow, collaborate with your team, and stay on top of all your projects
        in one unified platform.
      </p>
    </div>

    <!-- Trust indicators or small text -->
    <div class="relative z-10 text-indigo-200 text-sm">
      &copy; {{ currentYear }} Task Tracker. All rights reserved.
    </div>
  </div>

  <!-- Right Side: Content Area (Form) -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md">
      <router-outlet />
    </div>
  </div>
</div>
