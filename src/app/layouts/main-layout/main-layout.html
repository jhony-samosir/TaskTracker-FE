<div class="flex h-screen w-full overflow-hidden bg-slate-50">
  <!-- Sidebar Overlay for mobile -->
  @if (isMobile() && sidenavOpen()) {
    <button
      class="fixed inset-0 z-40 w-full bg-black/30 backdrop-blur-sm cursor-default"
      (click)="closeSidenavOnMobile()"
      aria-label="Close sidebar"
    ></button>
  }

  <!-- Sidebar -->
  <aside
    [class.-translate-x-full]="isMobile() && !sidenavOpen()"
    [class.translate-x-0]="isMobile() && sidenavOpen()"
    [class.w-[260px]]="sidenavOpen() || isMobile()"
    [class.w-[72px]]="!sidenavOpen() && !isMobile()"
    class="sidebar fixed md:relative z-50 h-full overflow-hidden border-r border-slate-200 bg-white transition-all duration-300 ease-in-out"
  >
    <app-sidebar
      [collapsed]="!sidenavOpen() && !isMobile()"
      [menuItems]="menuItems()"
      [user]="user()"
      (logout)="logout()"
      (createExactTask)="createTask()"
      (navigateMobile)="closeSidenavOnMobile()"
    ></app-sidebar>
  </aside>

  <!-- Main Content -->
  <div class="flex flex-1 flex-col min-w-0">
    <!-- Top Navigation Bar -->
    <header
      class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 lg:px-8"
    >
      <!-- Left: Menu + Breadcrumb -->
      <div class="flex items-center gap-3">
        <button
          (click)="toggleSidenav()"
          class="flex h-9 w-9 items-center justify-center rounded-xl text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-700"
          aria-label="Toggle sidebar"
        >
          <mat-icon class="text-xl">menu</mat-icon>
        </button>

        <div class="hidden sm:flex items-center gap-1.5 text-sm text-slate-400">
          <a
            routerLink="/dashboard"
            class="hover:text-indigo-600 hover:font-medium cursor-pointer transition-colors"
            >Home</a
          >
          <mat-icon class="text-base text-slate-300">chevron_right</mat-icon>
          <span class="font-semibold text-slate-800">{{ pageTitle() }}</span>
        </div>
      </div>

      <!-- Right: Search + Notifications + Profile -->
      <div class="flex items-center gap-2 lg:gap-3">
        <!-- Search -->
        <div class="relative hidden md:block">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-base text-slate-400"
            >search</mat-icon
          >
          <input
            type="text"
            placeholder="Search tasks..."
            class="h-9 w-56 rounded-xl border border-slate-200 bg-slate-50 pl-9 pr-3 text-sm text-slate-700 placeholder:text-slate-400 outline-none transition-all focus:w-72 focus:border-indigo-300 focus:bg-white focus:ring-2 focus:ring-indigo-100"
          />
        </div>

        <!-- Notification -->
        <button
          class="relative flex h-9 w-9 items-center justify-center rounded-xl text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-700"
          matTooltip="Notifications"
        >
          <mat-icon class="text-xl">notifications</mat-icon>
          <span
            class="absolute right-2 top-1.5 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"
          ></span>
        </button>

        <!-- User -->
        @if (user(); as u) {
          <div class="flex items-center gap-3 pl-2 lg:pl-3 lg:border-l lg:border-slate-200">
            <div class="hidden lg:block text-right">
              <div class="text-sm font-medium text-slate-800 leading-tight">{{ u.name }}</div>
              <div class="text-xs text-slate-500">{{ u.role }}</div>
            </div>
            <div
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-100 text-sm font-bold text-indigo-700"
            >
              {{ u.name.charAt(0) }}
            </div>
          </div>
        }
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
